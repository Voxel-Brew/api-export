name: Diagram images

on:
  push:
    branches: [master]
    paths:
      - "doc/img/**/*.puml"
      - ".github/workflows/diagram-images.yml"
  pull_request:
    paths:
      - "doc/img/**/*.puml"
      - ".github/workflows/diagram-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Render PlantUML diagrams
        shell: bash
        run: |
          mapfile -d '' diagrams < <(find doc/img -type f -name '*.puml' -print0)
          if (( ${#diagrams[@]} == 0 )); then
            echo 'No PlantUML diagrams found in doc/img.'
            exit 0
          fi
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/data" \
            --workdir /data \
            ghcr.io/plantuml/plantuml:1.2026.2 \
            --format svg "${diagrams[@]}"

      - name: Commit generated images
        if: github.event_name == 'push'
        shell: bash
        run: |
          git add -A -- doc/img
          if git diff --cached --quiet; then
            echo 'Diagram images are up to date.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'docs: update diagram images'
          git push
